name: Selfhost CI

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - "apps/**"
      - "infra/**"
      - "libs/**"
      - "tests/**"
      - "dev/**"
      - "VERSION"
      - "x.py"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_VERSION: "21.1.8"
  ZIG_VERSION: "0.15.2"
  PYTHON_VERSION: "3.12"
  SEED_TAG: v0.10.0

jobs:
  bootstrap:
    name: ${{ matrix.host_tag }} selfhost
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {host_tag: win-x64, runner: windows-latest, family: windows, msvc_arch: amd64}
          - {host_tag: win-arm64, runner: windows-11-arm, family: windows, msvc_arch: amd64_arm64}
          - {host_tag: linux-x64, runner: ubuntu-22.04, family: linux}
          - {host_tag: linux-arm64, runner: ubuntu-24.04-arm, family: linux}
          - {host_tag: macos-x64, runner: macos-15-intel, family: macos}
          - {host_tag: macos-arm64, runner: macos-15, family: macos}
    steps:
      - name: Checkout Kinal
        uses: actions/checkout@v4
        with:
          path: Kinal

      - name: Checkout Kinal-ThirdParty
        uses: actions/checkout@v4
        with:
          repository: Kinal-Lang/Kinal-ThirdParty
          ref: 31a1b9bf62aa51adef6479d40657fd0d26ecb23a
          sparse-checkout: |
            llvm/manifests
            cjson
            civetweb
          path: Kinal-ThirdParty

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Cache LLVM prebuilt
        if: matrix.family == 'windows'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: Kinal-ThirdParty/.cache/llvm/prebuilt
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.host_tag }}

      - name: Fetch LLVM prebuilt
        if: matrix.family == 'windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: Kinal
        run: python x.py fetch llvm-prebuilt

      - name: Install LLVM 21
        if: matrix.family == 'linux'
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          source /etc/os-release
          echo "deb https://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 lld-21 libclang-21-dev
          echo "LLVM_DIR=$(llvm-config-21 --cmakedir)" >> "$GITHUB_ENV"
          echo "$(llvm-config-21 --bindir)" >> "$GITHUB_PATH"

      - name: Install LLVM 21
        if: matrix.family == 'macos'
        shell: bash
        run: |
          brew install llvm@21
          echo "LLVM_DIR=$(brew --prefix llvm@21)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ matrix.family == 'windows' && '~/AppData/Local/Kinal/toolchains/zig' || '~/.cache/kinal/toolchains/zig' }}
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.host_tag }}

      - name: Fetch Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        working-directory: Kinal
        run: python x.py fetch zig-prebuilt

      - name: Setup MSVC environment
        if: matrix.family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}


      - name: Select Windows SDK C/C++ frontend
        if: matrix.family == 'windows'
        working-directory: Kinal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m infra.scripts.windows_host_compiler

      - name: Download verified C bootstrap seed
        shell: bash
        working-directory: Kinal
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_TAG: ${{ matrix.host_tag }}
        run: |
          asset="Kinal-${SEED_TAG#v}-$HOST_TAG.zip"
          gh release download "$SEED_TAG" --repo "$GITHUB_REPOSITORY" --dir ../seed-download \
            --pattern "$asset" --pattern "SHA256SUMS-$HOST_TAG.txt"
          python -m infra.scripts.selfhost_release extract-seed ../seed-download "$SEED_TAG" "$HOST_TAG" out/selfhost/stage0-host

      - name: Verify stage1, stage2 and stage3 convergence
        working-directory: Kinal
        run: python x.py selfhost-bootstrap --stage0-bundle out/selfhost/stage0-host --max-stage 3

      - name: Run stage3 regressions
        working-directory: Kinal
        shell: bash
        run: |
          ext=""
          if [[ "$RUNNER_OS" == Windows ]]; then ext=.exe; fi
          python tests/selfhost/run_selfhost_tests.py --root . --stage0-role bootstrap \
            --stage0 "out/selfhost/stage0-host/kinal$ext" --compiler "out/selfhost/stage3/kinal-selfhost$ext" --out-dir out/selfhost/tests
          KINAL_VM_PATH="$PWD/out/selfhost/stage3/kinalvm$ext" python -m unittest discover -s tests -p "test_*.py"

      - name: Build language server
        working-directory: Kinal
        run: |
          cmake -S apps/kinal-lsp/server -B out/lsp -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out/lsp --target kinal-lsp-server

      - name: Smoke-test the public SDK and prepare archives
        working-directory: Kinal
        env:
          HOST_TAG: ${{ matrix.host_tag }}
        run: python -m infra.scripts.selfhost_release package

      - name: Upload release assets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.host_tag }}
          path: Kinal/out/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

      - name: Upload selfhost reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-reports-${{ matrix.host_tag }}
          path: |
            Kinal/out/selfhost/bootstrap-report.json
            Kinal/out/selfhost/tests/results.json
          if-no-files-found: warn
          retention-days: 14
