name: Selfhost Bootstrap (Experimental)

on:
  workflow_dispatch:
    inputs:
      stage0_source:
        description: Stage0 compiler source
        type: choice
        options:
          - latest-release
          - source
        default: latest-release
      release_tag:
        description: Optional release tag (empty uses the latest published release)
        type: string
        required: false
        default: ""
      validation:
        description: Validation depth
        type: choice
        options:
          - bootstrap
          - bootstrap-and-regressions
        default: bootstrap
      clean:
        description: Clean bootstrap outputs (and source build outputs when applicable)
        type: boolean
        default: true
      run_windows_x64:
        description: Run Windows x64
        type: boolean
        default: true
      run_windows_arm64:
        description: Run Windows ARM64
        type: boolean
        default: true
      run_linux_x64:
        description: Run Linux x64
        type: boolean
        default: true
      run_linux_arm64:
        description: Run Linux ARM64
        type: boolean
        default: true
      run_macos_arm64:
        description: Run macOS ARM64
        type: boolean
        default: true
      run_macos_x64:
        description: Run macOS x64
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: selfhost-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: "21.1.8"
  ZIG_VERSION: "0.15.2"
  PYTHON_VERSION: "3.12"

jobs:
  select_matrix:
    name: Select selfhost matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_entries: ${{ steps.select.outputs.has_entries }}
    steps:
      - name: Build selected matrix
        id: select
        shell: bash
        env:
          RUN_WINDOWS_X64: ${{ inputs.run_windows_x64 }}
          RUN_WINDOWS_ARM64: ${{ inputs.run_windows_arm64 }}
          RUN_LINUX_X64: ${{ inputs.run_linux_x64 }}
          RUN_LINUX_ARM64: ${{ inputs.run_linux_arm64 }}
          RUN_MACOS_ARM64: ${{ inputs.run_macos_arm64 }}
          RUN_MACOS_X64: ${{ inputs.run_macos_x64 }}
        run: |
          python <<'PY'
          import json
          import os

          entries = [
              {
                  "id": "windows-x64",
                  "name": "Windows x64",
                  "runs_on": "windows-latest",
                  "timeout": 180,
                  "family": "windows",
                  "msvc_arch": "amd64",
                  "host_tag": "win-x64",
                  "exe_suffix": ".exe",
                  "zig_cache_path": "~/AppData/Local/Kinal/toolchains/zig",
                  "llvm_cache_path": "Kinal-ThirdParty/.cache/llvm/prebuilt",
                  "enabled": os.environ["RUN_WINDOWS_X64"] == "true",
              },
              {
                  "id": "windows-arm64",
                  "name": "Windows arm64",
                  "runs_on": "windows-11-arm",
                  "timeout": 180,
                  "family": "windows",
                  "msvc_arch": "amd64_arm64",
                  "host_tag": "win-arm64",
                  "exe_suffix": ".exe",
                  "zig_cache_path": "~/AppData/Local/Kinal/toolchains/zig",
                  "llvm_cache_path": "Kinal-ThirdParty/.cache/llvm/prebuilt",
                  "enabled": os.environ["RUN_WINDOWS_ARM64"] == "true",
              },
              {
                  "id": "linux-x64",
                  "name": "Linux x64",
                  "runs_on": "ubuntu-22.04",
                  "timeout": 180,
                  "family": "linux",
                  "msvc_arch": "",
                  "host_tag": "linux-x64",
                  "exe_suffix": "",
                  "zig_cache_path": "~/.cache/kinal/toolchains/zig",
                  "llvm_cache_path": "",
                  "enabled": os.environ["RUN_LINUX_X64"] == "true",
              },
              {
                  "id": "linux-arm64",
                  "name": "Linux arm64",
                  "runs_on": "ubuntu-24.04-arm",
                  "timeout": 180,
                  "family": "linux",
                  "msvc_arch": "",
                  "host_tag": "linux-arm64",
                  "exe_suffix": "",
                  "zig_cache_path": "~/.cache/kinal/toolchains/zig",
                  "llvm_cache_path": "",
                  "enabled": os.environ["RUN_LINUX_ARM64"] == "true",
              },
              {
                  "id": "macos-arm64",
                  "name": "macOS arm64",
                  "runs_on": "macos-14",
                  "timeout": 180,
                  "family": "macos",
                  "msvc_arch": "",
                  "host_tag": "macos-arm64",
                  "exe_suffix": "",
                  "zig_cache_path": "~/.cache/kinal/toolchains/zig",
                  "llvm_cache_path": "",
                  "enabled": os.environ["RUN_MACOS_ARM64"] == "true",
              },
              {
                  "id": "macos-x64",
                  "name": "macOS x64",
                  "runs_on": "macos-15-intel",
                  "timeout": 180,
                  "family": "macos",
                  "msvc_arch": "",
                  "host_tag": "macos-x64",
                  "exe_suffix": "",
                  "zig_cache_path": "~/.cache/kinal/toolchains/zig",
                  "llvm_cache_path": "",
                  "enabled": os.environ["RUN_MACOS_X64"] == "true",
              },
          ]

          selected = []
          for entry in entries:
              enabled = entry.pop("enabled")
              if enabled:
                  selected.append(entry)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={json.dumps({'include': selected}, separators=(',', ':'))}", file=output)
              print(f"has_entries={'true' if selected else 'false'}", file=output)
          PY

  bootstrap:
    needs: select_matrix
    name: ${{ matrix.name }} selfhost
    if: ${{ needs.select_matrix.outputs.has_entries == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select_matrix.outputs.matrix) }}

    steps:
      - name: Checkout Kinal
        uses: actions/checkout@v4
        with:
          path: Kinal

      - name: Checkout Kinal-ThirdParty
        uses: actions/checkout@v4
        with:
          repository: Kinal-Lang/Kinal-ThirdParty
          path: Kinal-ThirdParty

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup CMake and Ninja
        if: inputs.stage0_source == 'source'
        uses: lukka/get-cmake@latest

      - name: Cache LLVM prebuilt
        if: matrix.family == 'windows'
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ matrix.llvm_cache_path }}
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.host_tag }}

      - name: Fetch LLVM prebuilt
        if: matrix.family == 'windows' && steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: Kinal
        run: python x.py fetch llvm-prebuilt

      - name: Install LLVM 21
        if: matrix.family == 'linux'
        shell: bash
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 lld-21 libclang-21-dev

      - name: Install LLVM 21
        if: matrix.family == 'macos'
        shell: bash
        run: |
          brew install llvm@21
          echo "LLVM_DIR=$(brew --prefix llvm@21)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Cache Zig
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ matrix.zig_cache_path }}
          key: zig-${{ env.ZIG_VERSION }}-${{ matrix.host_tag }}

      - name: Fetch Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        working-directory: Kinal
        run: python x.py fetch zig-prebuilt

      - name: Setup MSVC environment
        if: matrix.family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download release stage0
        if: inputs.stage0_source == 'latest-release'
        id: release-stage0
        working-directory: Kinal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HOST_TAG: ${{ matrix.host_tag }}
        run: |
          arguments=(release download)
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=("$RELEASE_TAG")
          fi
          gh "${arguments[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Kinal-*-${HOST_TAG}.zip" \
            --dir stage0-download \
            --clobber

          python <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from infra.scripts.x.util import extract_zip_safely

          archives = list(Path("stage0-download").glob(f"Kinal-*-{os.environ['HOST_TAG']}.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one {os.environ['HOST_TAG']} release archive, found {len(archives)}")

          destination = Path("stage0-extracted")
          extract_zip_safely(archives[0], destination)
          executable = "kinal.exe" if os.name == "nt" else "kinal"
          compilers = [path for path in destination.rglob(executable) if path.is_file()]
          if len(compilers) != 1:
              raise SystemExit(f"Expected one stage0 compiler in the release archive, found {len(compilers)}")

          compiler = compilers[0].resolve()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"bundle={compiler.parent}", file=output)
              print(f"archive={archives[0].name}", file=output)
          subprocess.run([str(compiler), "--version"], check=True)
          PY

      - name: Bootstrap with release stage0
        if: inputs.stage0_source == 'latest-release'
        working-directory: Kinal
        shell: bash
        run: |
          arguments=(
            x.py selfhost-bootstrap
            --stage0-bundle "${{ steps.release-stage0.outputs.bundle }}"
            --target 100.0
            --max-stage 3
            --bootstrap-backend self
            --metric-backend self
          )
          if [[ "${{ inputs.clean }}" == "true" ]]; then
            arguments+=(--clean)
          fi
          python "${arguments[@]}"

      - name: Bootstrap with source-built stage0
        if: inputs.stage0_source == 'source'
        working-directory: Kinal
        shell: bash
        run: |
          arguments=(
            x.py selfhost-bootstrap
            --target 100.0
            --max-stage 3
            --bootstrap-backend self
            --metric-backend self
          )
          if [[ "${{ inputs.clean }}" == "true" ]]; then
            arguments+=(--clean)
          fi
          python "${arguments[@]}"

      - name: Run selfhost regressions
        if: inputs.validation == 'bootstrap-and-regressions'
        working-directory: Kinal
        shell: bash
        run: |
          stage0_role=reference
          if [[ "${{ inputs.stage0_source }}" == "latest-release" ]]; then
            stage0_role=bootstrap
          fi
          python tests/selfhost/run_selfhost_tests.py \
            --stage0 out/selfhost/stage0-host/kinal${{ matrix.exe_suffix }} \
            --compiler out/selfhost/stage1/kinal-selfhost${{ matrix.exe_suffix }} \
            --root . \
            --out-dir out/selfhost/tests \
            --stage0-role "$stage0_role"

      - name: Write run summary
        if: always()
        working-directory: Kinal
        shell: bash
        env:
          RELEASE_ARCHIVE: ${{ steps.release-stage0.outputs.archive }}
          STAGE0_SOURCE: ${{ inputs.stage0_source }}
          RELEASE_TAG_DISPLAY: ${{ inputs.release_tag || 'latest' }}
          VALIDATION: ${{ inputs.validation }}
          HOST_TAG: ${{ matrix.host_tag }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          archive = os.environ.get("RELEASE_ARCHIVE") or "not used"
          summary = "\n".join([
              "## Experimental selfhost bootstrap",
              "",
              f"- Stage0 source: `{os.environ['STAGE0_SOURCE']}`",
              f"- Release tag: `{os.environ['RELEASE_TAG_DISPLAY']}`",
              f"- Release archive: `{archive}`",
              f"- Validation: `{os.environ['VALIDATION']}`",
              f"- Host: `{os.environ['HOST_TAG']}`",
              "",
          ])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(summary)
          PY

      - name: Upload selfhost reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-reports-${{ matrix.id }}-${{ inputs.stage0_source }}
          path: |
            Kinal/out/selfhost/bootstrap-report.json
            Kinal/out/selfhost/tests/results.json
            Kinal/out/selfhost/stage1/self.ll
            Kinal/out/selfhost/stage2/self.ll
            Kinal/out/selfhost/stage3/self.ll
          if-no-files-found: warn
          retention-days: 14
