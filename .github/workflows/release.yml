name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run for this commit (empty selects automatically)
        type: string
        required: false
      publish:
        description: Publish the completed release
        type: boolean
        default: false

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select validated default-branch artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python -m infra.scripts.selfhost_release resolve-run
      - name: Download the verified SDKs
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python -m infra.scripts.selfhost_release verify-assets release-assets
          gh release create "$TAG" release-assets/* --draft --target "$GITHUB_SHA" \
            --title "Kinal ${TAG#v}" --notes-file "dev/releases/${TAG#v}.md"
          if [[ "$PUBLISH" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
